# Render Blueprint: free web service running the EventControl Docker image.
# Database and files live in Supabase (free), because free Render instances have no
# persistent disk. See README → "Free cloud hosting (Render + Supabase)".
services:
  - type: web
    name: eventcontrol
    runtime: docker
    plan: free
    # Closest Render region to Supabase's Mumbai/Singapore regions. Pick the one near your
    # Supabase project (oregon, ohio, virginia, frankfurt or singapore).
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL          # Supabase → Connect → "Session pooler" URI
        sync: false
      - key: SUPABASE_URL          # Supabase → Project Settings → Data API → Project URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY # Project Settings → API Keys (service_role, or a secret key)
        sync: false
      - key: SUPABASE_BUCKET
        value: eventcontrol
      - key: GOOGLE_CLIENT_ID      # optional: Google Drive import (README → Google Drive)
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_API_KEY        # browser key for Google's file picker (restricted to your site + Picker API)
        sync: false
      # The free instance has 512 MB: leave room for LibreOffice converting a PowerPoint.
      - key: NODE_OPTIONS
        value: --max-old-space-size=320
      # Accounts: people sign in with the email/password you create in Supabase → Authentication
      # → Users. Each account only sees its own events. ("none" = open to anyone with the link.)
      - key: AUTH_PROVIDER
        value: supabase
      - key: SUPABASE_ANON_KEY     # Supabase → Project Settings → API Keys → Publishable key (or legacy anon)
        sync: false
      # Optional: emails for "Request access" (the code that confirms someone's email, and notes
      # to you and to them). Free Brevo account → SMTP & API → API keys. See docs/DEPLOY.md Part D.
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM            # the sender address you verified in Brevo
        sync: false
