# Keeps the hosted EventControl from going idle for good: Supabase's free plan pauses a project
# after 7 days of low activity. Each run wakes the Render server (it sleeps after ~15
# minutes idle and takes about a minute to start) and asks it to touch the database.
# Runs twice a day so one missed run (GitHub can skip scheduled runs when busy) never leaves
# a gap. Uses ~2 minutes of GitHub Actions a day. Change the address below if the site moves.
name: Keep alive

on:
  schedule:
    - cron: '17 6 * * *' # every day, 06:17 UTC
    - cron: '17 18 * * *' # and 18:17 UTC
  workflow_dispatch: # "Run workflow" button, to try it

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wake the server and touch the database
        run: |
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS --max-time 90 -o reply.json -w '%{http_code}' https://eventcontrol.onrender.com/api/keep-alive || echo 000)
            cat reply.json 2>/dev/null; echo
            if [ "$code" = 200 ]; then echo "Active."; exit 0; fi
            echo "Answered $code (attempt $attempt), retrying in 30 s…"; sleep 30
          done
          echo "::error::The site didn't answer. If the reply says \"database\":false, the Supabase project is paused: open supabase.com/dashboard and click Restore. Otherwise check the service on Render."
          exit 1
